  <style>html { background: #18181A; }</style>

<body>
  <!-- The particle face IS the loader: it streams in, runs a lap of the
       bus circuit and forms, then hands the page over. `booting` holds
       the rest of the hero back until it lands. ParticleFace.jsx clears
       it; the timeout below is the hard safety net so a WebGL failure,
       a missing texture or a blocked script can never trap a visitor
       behind an empty screen. -->
  <script>
    (function () {
      try {
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) { window.PRELOADER_DONE = true; return; }
        document.documentElement.classList.add('booting');
        setTimeout(function () {
          if (window.PRELOADER_DONE) return;
          window.PRELOADER_DONE = true;
          document.documentElement.classList.remove('booting');
          window.dispatchEvent(new Event('preloader-done'));
        }, 8000);
      } catch (e) {
        window.PRELOADER_DONE = true;
        document.documentElement.classList.remove('booting');
      }
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
