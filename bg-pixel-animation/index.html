<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Component Demo</title>

   <!-- Connected Styles -->
   <link rel="stylesheet" href="style.css" />
</head>

<body>
   <!-- ===== HTML ===== -->
   <div class="index">
      <div class="stage">
         <div class="text">ANIMMASTER</div>
         <div class="pixel-blast" data-variant="square" data-pixel-size="4" data-color="#33c7ff" data-pattern-scale="2"
            data-pattern-density="1" data-pixel-jitter="0" data-enable-ripples="true" data-ripple-speed="0.4"
            data-ripple-thickness="0.12" data-ripple-intensity="1.5" data-liquid="false" data-liquid-strength="0.12"
            data-liquid-radius="1.2" data-liquid-wobble="5" data-speed="0.5" data-edge-fade="0.25"
            data-transparent="true" data-antialias="true" data-noise="0"></div>
      </div>
   </div>
   <!-- ======================= -->

<script src="script.js"></script>
</body>

</html>
